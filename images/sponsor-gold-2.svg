<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Dégradés Dorés Premium -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB"/>
      <stop offset="30%" stop-color="#F8B500"/>
      <stop offset="50%" stop-color="#DDA835"/>
      <stop offset="70%" stop-color="#FCEABB"/>
      <stop offset="100%" stop-color="#9B7114"/>
    </linearGradient>

    <!-- Dégradé Fond Sombre -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E222A"/>
      <stop offset="70%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Dégradé Orange Officiel -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9233"/>
      <stop offset="100%" stop-color="#FF7900"/>
    </linearGradient>

    <!-- Effets d'ombre et de lueur -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond Principal du Badge -->
  <rect width="600" height="600" rx="30" fill="url(#bgGrad)"/>

  <!-- Anneaux décoratifs extérieurs -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 8"/>
  <circle cx="300" cy="300" r="245" fill="none" stroke="url(#goldLinear)" stroke-width="2" opacity="0.5"/>
  <circle cx="300" cy="300" r="235" fill="none" stroke="#FF7900" stroke-width="1" opacity="0.4"/>

  <!-- Écusson Hexagonal Doré -->
  <polygon points="300,70 470,168 470,364 300,462 130,364 130,168" 
           fill="#12151B" 
           stroke="url(#goldLinear)" 
           stroke-width="5" 
           filter="url(#shadow)"/>

  <!-- Ligne intérieure pointillée -->
  <polygon points="300,82 458,174 458,356 300,448 142,356 142,174" 
           fill="none" 
           stroke="url(#goldLinear)" 
           stroke-width="1.5" 
           stroke-dasharray="6,5" 
           opacity="0.7"/>

  <!-- Étoiles de niveau Gold (3 étoiles) -->
  <g fill="url(#goldLinear)" filter="url(#goldGlow)">
    <polygon points="240,112 243,121 252,121 245,126 248,135 240,130 232,135 235,126 228,121 237,121"/>
    <polygon points="300,100 304,112 317,112 306,119 310,131 300,123 290,131 294,119 283,112 296,112"/>
    <polygon points="360,112 363,121 372,121 365,126 368,135 360,130 352,135 355,126 348,121 357,121"/>
  </g>

  <!-- LOGO ORANGE DIGITAL CENTER (Icône Carrée Réseau) -->
  <g transform="translate(245, 155)">
    <rect x="0" y="0" width="110" height="110" rx="12" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    
    <!-- Pattern Réseau / Circuits Blancs -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round">
      <circle cx="30" cy="30" r="5.5" stroke="none"/>
      <circle cx="80" cy="30" r="5.5" stroke="none"/>
      <circle cx="55" cy="55" r="7.5" stroke="none"/>
      <circle cx="30" cy="80" r="5.5" stroke="none"/>
      <circle cx="80" cy="80" r="5.5" stroke="none"/>
      
      <line x1="30" y1="30" x2="55" y2="55" stroke-width="3"/>
      <line x1="80" y1="30" x2="55" y2="55" stroke-width="3"/>
      <line x1="30" y1="80" x2="55" y2="55" stroke-width="3"/>
      <line x1="80" y1="80" x2="55" y2="55" stroke-width="3"/>
    </g>
  </g>

  <!-- Marquage Marque "orange" -->
  <text x="300" y="305" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="34" 
        fill="#FF7900" 
        text-anchor="middle" 
        letter-spacing="-0.5">
    orange™
  </text>

  <!-- Sous-titre "DIGITAL CENTER" -->
  <text x="300" y="335" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="14" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="4">
    DIGITAL CENTER
  </text>

  <!-- Bannière SPONSOR GOLD -->
  <g transform="translate(0, 360)" filter="url(#shadow)">
    <path d="M 160,35 L 140,55 L 160,75 L 440,75 L 460,55 L 440,35 Z" fill="#0A0D12" stroke="url(#goldLinear)" stroke-width="2"/>
    <rect x="170" y="40" width="260" height="30" rx="15" fill="url(#goldLinear)"/>
    <text x="300" y="60" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="15" 
          fill="#0B0E14" 
          text-anchor="middle" 
          letter-spacing="3">
      SPONSOR GOLD
    </text>
  </g>

  <!-- Nœuds Tech dorés aux coins -->
  <circle cx="130" cy="168" r="4" fill="url(#goldLinear)"/>
  <circle cx="470" cy="168" r="4" fill="url(#goldLinear)"/>
  <circle cx="130" cy="364" r="4" fill="url(#goldLinear)"/>
  <circle cx="470" cy="364" r="4" fill="url(#goldLinear)"/>
</svg>
