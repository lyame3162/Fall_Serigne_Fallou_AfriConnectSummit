<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Dégradé Argenté Métallique Principale -->
    <linearGradient id="silverLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6E8EA"/>
      <stop offset="25%" stop-color="#C4C9CE"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#9EA4AA"/>
      <stop offset="100%" stop-color="#555A60"/>
    </linearGradient>

    <!-- Dégradé Argenté Secondaire (Accents) -->
    <linearGradient id="silverAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A9097"/>
      <stop offset="50%" stop-color="#E6E8EA"/>
      <stop offset="100%" stop-color="#A2A8AF"/>
    </linearGradient>

    <!-- Dégradé Fond Sombre -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E222A"/>
      <stop offset="70%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Couleurs Officielles Flutterwave -->
    <!-- Jaune / Ambre Flutterwave -->
    <linearGradient id="flwAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Filtres d'ombre et de lueur -->
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond Principal -->
  <rect width="600" height="600" rx="30" fill="url(#bgGrad)"/>

  <!-- Cercles décoratifs extérieurs -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="url(#silverLinear)" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 8"/>
  <circle cx="300" cy="300" r="245" fill="none" stroke="url(#silverLinear)" stroke-width="2" opacity="0.5"/>
  <circle cx="300" cy="300" r="235" fill="none" stroke="#FB923C" stroke-width="1" opacity="0.3"/>

  <!-- Écusson Hexagonal Argenté -->
  <polygon points="300,70 470,168 470,364 300,462 130,364 130,168" 
           fill="#12151B" 
           stroke="url(#silverLinear)" 
           stroke-width="5" 
           filter="url(#shadow)"/>

  <!-- Ligne intérieure pointillée -->
  <polygon points="300,82 458,174 458,356 300,448 142,356 142,174" 
           fill="none" 
           stroke="url(#silverAccent)" 
           stroke-width="1.5" 
           stroke-dasharray="6,5" 
           opacity="0.7"/>

  <!-- Étoiles de niveau Silver (2 étoiles) -->
  <g fill="url(#silverLinear)" filter="url(#silverGlow)">
    <polygon points="265,108 269,118 280,118 271,124 274,134 265,128 256,134 259,124 250,118 261,118"/>
    <polygon points="335,108 339,118 350,118 341,124 344,134 335,128 326,134 329,124 320,118 331,118"/>
  </g>

  <!-- LOGO FLUTTERWAVE (Icône vagues / vague stylisée) -->
  <g transform="translate(195, 155)">
    <!-- Fond d'accent sombre pour l'icône -->
    <rect x="0" y="0" width="210" height="110" rx="16" fill="#1A1F29" stroke="url(#silverAccent)" stroke-width="1"/>
    
    <!-- Waves / Logo Flutterwave Icon -->
    <g transform="translate(70, 15)">
      <!-- Vague Supérieure (Bleu / Teal Flutterwave ou Argent Métal) -->
      <path d="M 0,20 C 25,0 45,40 70,20 C 60,45 35,25 0,50 Z" fill="#22D3EE" opacity="0.9" />
      <!-- Vague Principale (Orange / Ambre Flutterwave) -->
      <path d="M 0,35 C 25,15 45,55 70,35 C 60,60 35,40 0,65 Z" fill="url(#flwAmber)" />
      <!-- Vague Inférieure (Argenté) -->
      <path d="M 0,50 C 25,30 45,70 70,50 C 60,75 35,55 0,80 Z" fill="url(#silverLinear)" opacity="0.8" />
    </g>
  </g>

  <!-- Texte "Flutterwave" -->
  <text x="300" y="312" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="30" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-0.5">
    Flutterwave
  </text>

  <!-- Bannière SPONSOR SILVER -->
  <g transform="translate(0, 360)" filter="url(#shadow)">
    <!-- Arrière-plan ruban -->
    <path d="M 160,35 L 140,55 L 160,75 L 440,75 L 460,55 L 440,35 Z" fill="#0A0D12" stroke="url(#silverLinear)" stroke-width="2"/>
    
    <!-- Plaque Argentée Principale -->
    <rect x="170" y="40" width="260" height="30" rx="15" fill="url(#silverLinear)"/>
    
    <!-- Texte SPONSOR SILVER -->
    <text x="300" y="60" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="15" 
          fill="#0D1117" 
          text-anchor="middle" 
          letter-spacing="3">
      SPONSOR SILVER
    </text>
  </g>

  <!-- Nœuds Tech argentés aux coins -->
  <circle cx="130" cy="168" r="4" fill="url(#silverLinear)"/>
  <circle cx="470" cy="168" r="4" fill="url(#silverLinear)"/>
  <circle cx="130" cy="364" r="4" fill="url(#silverLinear)"/>
  <circle cx="470" cy="364" r="4" fill="url(#silverLinear)"/>
</svg>
